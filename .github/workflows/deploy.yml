name: Deploy site
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/validate.mjs
      - name: Install WebP tools when posters are missing
        continue-on-error: true
        run: |
          if [ "$(node scripts/sync-posters.mjs --needs-download)" = "yes" ]; then
            sudo apt-get update
            sudo apt-get install -y webp
          fi
      - run: node scripts/sync-posters.mjs
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      - name: Commit poster updates
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add movie-posters.json public/posters
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync TMDB poster paths"
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              pushed=1
              break
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::warning::海报更新没有推送成功，本次构建仍会发布已下载的海报。"
          fi
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
