name: Sync movie posters
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [movies.json, scripts/sync-posters.mjs, .github/workflows/movie-posters.yml]
permissions:
  contents: write
concurrency:
  group: movie-posters
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-posters.mjs
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      - name: Verify TMDB poster images
        run: |
          jq -r ' .[] ' movie-posters.json | while read -r path; do
            rm -f /tmp/movie-poster.jpg
            curl -fsSL --retry 3 --max-time 30 "https://image.tmdb.org/t/p/w342$path" -o /tmp/movie-poster.jpg
            test "$(file -b --mime-type /tmp/movie-poster.jpg)" = image/jpeg || exit 1
          done
      - run: |
          git add movie-posters.json
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Sync TMDB poster paths'
            git push
          fi
